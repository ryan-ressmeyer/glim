name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  linux-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Action release commits are pinned by SHA so moved tags cannot change a release build.
      - name: Check out the tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Validate tag and checkout
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ github.ref_name }}'
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse "${GITHUB_REF}^{commit}")" = "${GITHUB_SHA}"
          test "$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)" = "${VERSION#v}"
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.93.1
          components: clippy,rustfmt
          targets: x86_64-unknown-linux-gnu
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.22.0
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install locked Pi package dependencies
        run: npm ci
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Run complete repository checks
        run: make check
      - name: Build release binary with embedded frontend
        run: cargo build --release --locked --target x86_64-unknown-linux-gnu
      - name: Package binary and checksum
        shell: bash
        run: |
          set -euo pipefail
          VERSION='${{ github.ref_name }}'
          TARGET='x86_64-unknown-linux-gnu'
          PACKAGE="glim-${VERSION}-${TARGET}"
          ARTIFACT="glim-${VERSION}-${TARGET}.tar.gz"
          mkdir -p "dist/${PACKAGE}"
          install -m 0755 "target/${TARGET}/release/glim" "dist/${PACKAGE}/glim"
          install -m 0644 LICENSE README.md "dist/${PACKAGE}/"
          tar -C dist -czf "dist/${ARTIFACT}" "${PACKAGE}"
          cd dist
          sha256sum "${ARTIFACT}" > "${ARTIFACT}.sha256"
      - name: Publish versioned release assets
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          body: |
            tag: ${{ github.ref_name }}
            commit: ${{ github.sha }}
            target: x86_64-unknown-linux-gnu
          fail_on_unmatched_files: true
          files: |
            dist/glim-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz
            dist/glim-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz.sha256
