[package]
name = "glim"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
cssparser = "0.36"
getrandom = "0.4"
percent-encoding = "2"
pulldown-cmark = "0.13"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "stream"] }
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.25"
sha2 = "0.10"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
tokio-stream = "0.1"
